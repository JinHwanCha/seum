<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>세움 앱 검증</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #faf8f3; color: #292524; font-family: sans-serif; }
      main { max-width: 360px; text-align: center; }
      p { line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>세움</h1>
      <p>이 파일은 Capacitor 프로젝트 동기화용입니다. 검증용 앱은 인터넷에 연결해 기존 세움 웹서비스를 실행합니다.</p>
      <p>이 구성은 스토어 출시용 또는 오프라인 웹서비스가 아닙니다.</p>
    </main>
  </body>
</html>
