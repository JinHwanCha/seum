<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4a7d57" />
    <title>세움 - 오프라인</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fafaf9; color: #292524; font-family: sans-serif; }
      main { width: min(100%, 360px); text-align: center; }
      strong { display: block; margin-bottom: 8px; color: #3d6b48; font-size: 24px; }
      p { margin: 0 0 20px; color: #78716c; line-height: 1.6; }
      button { border: 0; border-radius: 8px; padding: 11px 18px; background: #4a7d57; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <strong>세움</strong>
      <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
